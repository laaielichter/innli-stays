<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#f5efe4}svg{display:block}
</style></head><body>
<svg id="s" width="720" height="1280" viewBox="0 0 720 1280" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbe3c4"/><stop offset=".55" stop-color="#f8ecd9"/><stop offset="1" stop-color="#f5efe4"/></linearGradient>
<radialGradient id="sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd58a"/><stop offset=".45" stop-color="#f6b25e"/><stop offset="1" stop-color="#f6b25e" stop-opacity="0"/></radialGradient>
</defs>
<rect width="720" height="1280" fill="url(#sky)"/>
<circle id="sunc" cx="560" cy="640" r="230" fill="url(#sun)"/>
<circle id="sund" cx="560" cy="640" r="78" fill="#f2a24b"/>
<g id="clouds" fill="#fffaf0" opacity=".9"></g>
<g id="far"></g><g id="mid"></g><g id="trees"></g>
<rect y="930" width="720" height="350" fill="#7a9a7e"/>
<rect y="960" width="720" height="120" fill="#17202a"/>
<g id="dash"></g>
<rect y="1080" width="720" height="200" fill="#6a8a6f"/>
<g id="near"></g>
<g font-family="Inter Display, Inter, sans-serif" font-weight="800" fill="#17202a" text-anchor="middle" font-size="68" letter-spacing="-2">
  <text id="t1" x="360" y="250">Your next</text>
  <text id="t2" x="360" y="330">camper trip</text>
  <text id="t3" x="360" y="440" font-size="56">starts with</text>
  <text id="t4" x="360" y="516" fill="#d9643a">one sentence.</text>
</g>
<g id="camper">
  <ellipse cx="0" cy="92" rx="190" ry="10" fill="#000" opacity=".25"/>
  <path d="M-185 60 L-185 -70 Q-185 -112 -143 -112 L70 -112 Q118 -112 140 -72 L170 -16 Q186 -8 186 14 L186 60 Z" fill="#fbf7ef" stroke="#17202a" stroke-width="7" stroke-linejoin="round"/>
  <path d="M-185 8 L186 8 L186 34 L-185 34 Z" fill="#d9643a"/>
  <path d="M84 -88 L112 -88 Q124 -88 132 -72 L156 -22 L84 -22 Z" fill="#9cc8d8" stroke="#17202a" stroke-width="6" stroke-linejoin="round"/>
  <rect x="-150" y="-82" width="92" height="56" rx="10" fill="#ffd58a" stroke="#17202a" stroke-width="6"/>
  <rect x="-34" y="-82" width="70" height="56" rx="10" fill="#9cc8d8" stroke="#17202a" stroke-width="6"/>
  <rect x="-26" y="-14" width="56" height="74" rx="6" fill="none" stroke="#17202a" stroke-width="5" opacity=".0"/>
  <rect x="-120" y="-134" width="120" height="22" rx="8" fill="#17202a"/>
  <circle cx="178" cy="24" r="8" fill="#ffd58a" stroke="#17202a" stroke-width="4"/>
  <g id="w1" transform="translate(-105 62)"><circle r="36" fill="#17202a"/><circle r="15" fill="#fbf7ef"/><rect x="-3" y="-30" width="6" height="60" fill="#5b6672"/><rect x="-30" y="-3" width="60" height="6" fill="#5b6672"/></g>
  <g id="w2" transform="translate(105 62)"><circle r="36" fill="#17202a"/><circle r="15" fill="#fbf7ef"/><rect x="-3" y="-30" width="6" height="60" fill="#5b6672"/><rect x="-30" y="-3" width="60" height="6" fill="#5b6672"/></g>
</g>
</svg>
<script>
const NS='http://www.w3.org/2000/svg';const el=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};
const far=document.getElementById('far'),mid=document.getElementById('mid'),trees=document.getElementById('trees'),dash=document.getElementById('dash'),clouds=document.getElementById('clouds'),near=document.getElementById('near');
// Hills: wide repeating shapes (period P) drawn twice so they loop.
function hills(g,P,base,amp,fill,seed){let d='';for(let k=0;k<2;k++){const ox=k*P;d+=`M${ox} ${base}`;for(let x=0;x<=P;x+=40){const y=base-amp*(0.55+0.45*Math.sin((x/P)*Math.PI*2*2+seed))-amp*0.25*Math.sin((x/P)*Math.PI*2*5+seed*2);d+=` L${ox+x} ${y.toFixed(1)}`}d+=` L${ox+P} 1000 L${ox} 1000 Z `}el('path',{d,fill},g)}
hills(far,1440,900,170,'#c9d6c0',1);hills(mid,1440,940,120,'#9db59c',2.4);
for(let k=0;k<2;k++)for(let i=0;i<7;i++){const x=k*1440+i*206+60,h=90+((i*37)%50);const g=el('g',{transform:`translate(${x} 940)`},trees);el('rect',{x:-5,y:-20,width:10,height:24,fill:'#5b4a3a'},g);el('path',{d:`M0 ${-h} L${h*.32} -18 L${-h*.32} -18 Z`,fill:'#4f7358'},g);el('path',{d:`M0 ${-h*.72} L${h*.38} ${-h*.1} L${-h*.38} ${-h*.1} Z`,fill:'#5f8467'},g)}
for(let k=0;k<2;k++)for(let i=0;i<8;i++)el('rect',{x:k*1440+i*180,y:1014,width:96,height:10,rx:5,fill:'#fbf7ef'},dash);
for(let k=0;k<2;k++)for(let i=0;i<3;i++){const g=el('g',{transform:`translate(${k*1440+i*480+100} ${170+i*70})`},clouds);el('ellipse',{rx:90,ry:26},g);el('ellipse',{cx:-40,cy:-18,rx:46,ry:26},g);el('ellipse',{cx:30,cy:-26,rx:56,ry:32},g)}
for(let k=0;k<2;k++)for(let i=0;i<6;i++){const g=el('g',{transform:`translate(${k*1440+i*240+30} 1130)`},near);el('path',{d:'M-30 20 Q-18 -30 0 20 Q10 -44 26 20 Z',fill:'#4f7358'},g);el('circle',{cx:44,cy:8,r:7,fill:'#d9643a'},g)}
window.frame=function(t){ // t in seconds
  const v=260; const m=(x,P)=>-(((x%P)+P)%P);
  far.setAttribute('transform',`translate(${m(t*v*.12,1440)} 0)`);
  mid.setAttribute('transform',`translate(${m(t*v*.28,1440)} 0)`);
  trees.setAttribute('transform',`translate(${m(t*v*.5,1440)} 0)`);
  clouds.setAttribute('transform',`translate(${m(t*v*.05,1440)} 0)`);
  dash.setAttribute('transform',`translate(${m(t*v*1.6,1440)} 0)`);
  near.setAttribute('transform',`translate(${m(t*v*2.2,1440)} 0)`);
  const ease=x=>1-Math.pow(1-Math.min(1,Math.max(0,x)),3);
  const cx=-260+ease(t/1.6)*590+Math.sin(t*.9)*14; const bob=Math.sin(t*9)*2.2;
  document.getElementById('camper').setAttribute('transform',`translate(${cx} ${905+bob}) scale(1.25)`);
  const rot=t*v*1.6/36*57.3;
  document.getElementById('w1').setAttribute('transform',`translate(-105 62) rotate(${rot})`);
  document.getElementById('w2').setAttribute('transform',`translate(105 62) rotate(${rot})`);
  [['t1',.3],['t2',.9],['t3',1.9],['t4',2.5]].forEach(([id,at])=>{const k=ease((t-at)/.35),e=document.getElementById(id);e.setAttribute('opacity',k);e.setAttribute('transform',`translate(0 ${(1-k)*26})`)});
  const sy=660-ease(t/6)*40; for(const id of ['sunc','sund'])document.getElementById(id).setAttribute('cy',sy);
};
frame(0);
</script></body></html>
